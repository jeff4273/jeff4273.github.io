<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Final Grade Calculator</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 30px;
            max-width: 420px;
            width: 100%;
        }

        h1 {
            margin-top: 0;
            color: #333;
            text-align: center;
        }

        .field {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: #333;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1rem;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #667eea;
            color: white;
            font-size: 1rem;
            cursor: pointer;
        }

        button:hover {
            background: #5a67d8;
        }

        .result {
            margin-top: 16px;
            text-align: center;
            font-size: 1.1rem;
            color: #222;
            min-height: 24px;
        }

        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            top: -12px;
            opacity: 0.9;
            pointer-events: none;
            animation: fall 1.8s linear forwards;
            z-index: 9999;
        }

        @keyframes fall {
            to {
                transform: translateY(110vh) rotate(720deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Final Grade Calculator</h1>

        <div class="field">
            <label for="q1">Quarter 1 Grade</label>
            <input id="q1" type="number" step="any" required>
        </div>

        <div class="field">
            <label for="q2">Quarter 2 Grade</label>
            <input id="q2" type="number" step="any" required>
        </div>

        <div class="field">
            <label for="finalExam">Final Exam Grade</label>
            <input id="finalExam" type="number" step="any" required>
        </div>

        <button type="button" id="calculate">Calculate</button>
        <div class="result" id="result"></div>
    </div>

    <script>
        const q1Input = document.getElementById("q1");
        const q2Input = document.getElementById("q2");
        const finalExamInput = document.getElementById("finalExam");
        const resultEl = document.getElementById("result");
        const calculateButton = document.getElementById("calculate");
        const QUARTER_WEIGHT = 2;
        const TOTAL_WEIGHT = 5;
        const CONFETTI_COLORS = ["#ff6b6b", "#ffd93d", "#6bcb77", "#4d96ff", "#c77dff"];

        function launchConfetti() {
            const pieceCount = 70;
            for (let i = 0; i < pieceCount; i++) {
                const piece = document.createElement("div");
                piece.className = "confetti";
                piece.style.left = `${Math.random() * 100}vw`;
                piece.style.backgroundColor = CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)];
                piece.style.transform = `rotate(${Math.random() * 360}deg)`;
                piece.style.animationDelay = `${Math.random() * 0.5}s`;
                piece.style.animationDuration = `${1.2 + Math.random() * 1.2}s`;
                document.body.appendChild(piece);
                piece.addEventListener("animationend", () => piece.remove());
            }
        }

        calculateButton.addEventListener("click", () => {
            const q1 = Number(q1Input.value);
            const q2 = Number(q2Input.value);
            const finalExamGrade = Number(finalExamInput.value);

            if (
                Number.isNaN(q1) ||
                Number.isNaN(q2) ||
                Number.isNaN(finalExamGrade) ||
                q1Input.value === "" ||
                q2Input.value === "" ||
                finalExamInput.value === ""
            ) {
                resultEl.textContent = "Please enter all three grades.";
                return;
            }

            const calculatedGrade = ((q1 * QUARTER_WEIGHT + q2 * QUARTER_WEIGHT) + finalExamGrade) / TOTAL_WEIGHT;
            resultEl.textContent = `Calculated Grade: ${calculatedGrade.toFixed(2)}`;
            if (calculatedGrade > 90) {
                launchConfetti();
            }
        });
    </script>
</body>
</html>
