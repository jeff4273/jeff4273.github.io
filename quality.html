<html>
<head>
    <style>
        /* Existing styles */
        tr {
            transition: background-color 0.3s;
        }
        tr:hover {
            background-color: lightgray;
        }
        /* New style for team 3937 */
        .team-3937 {
            color: red; /* or background-color: red; */
        }
    </style>
    <script>
        function displayLeaderboard(teams) {
            const tableBody = document.getElementById('leaderboard');
            tableBody.innerHTML = '';

            teams.forEach(team => {
                const row = document.createElement('tr');

                // Add relevant class for team 3937
                if (team.team === '3937' || team.team === 3937) {
                    row.classList.add('team-3937');
                }

                row.innerHTML = `<td>${team.name}</td><td>${team.score}</td>`;
                tableBody.appendChild(row);
            });
        }
    </script>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th>Team Name</th>
                <th>Score</th>
            </tr>
        </thead>
        <tbody id='leaderboard'>
            <!-- Dynamic rows will be added here -->
        </tbody>
    </table>
</body>
</html>
